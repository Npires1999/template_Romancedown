<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal Marinha / Dossiê Pirata - Gerador RPG</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;600;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- SDK do Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background-color: #050505; color: #e0e0e0;
      font-family: 'Inter', sans-serif; display: flex; overflow: hidden;
    }

    /* Painel da Esquerda (Editor) */
    .editor-panel {
      width: 420px; min-width: 420px; background-color: #000000;
      border-right: 1px solid #1f1f1f; padding: 20px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 15px; height: 100vh;
    }
    .editor-title {
      font-size: 14px; font-weight: 700; color: #e86830;
      letter-spacing: 2px; text-transform: uppercase;
      border-bottom: 1px solid #1a1a1a; padding-bottom: 8px;
    }
    .editor-subtitle {
      font-size: 11px; font-weight: 700; color: #a0a0a0;
      letter-spacing: 1px; text-transform: uppercase; margin-top: 5px;
      border-bottom: 1px dashed #222; padding-bottom: 4px;
    }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label {
      font-size: 10px; text-transform: uppercase;
      letter-spacing: 1px; color: #888; font-weight: 600;
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    input, textarea {
      background-color: #0a0a0a; border: 1px solid #222;
      border-radius: 6px; color: #fff; padding: 8px 10px;
      font-size: 12px; font-family: inherit; outline: none; width: 100%;
    }
    input:focus, textarea:focus { border-color: #e86830; }
    textarea { resize: vertical; min-height: 80px; }
    .btn-group { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 10px; }
    .btn-action {
      background: linear-gradient(90deg, #e86830, #ff3e00);
      color: #fff; border: none; padding: 12px; border-radius: 6px;
      font-weight: 700; font-size: 11px; letter-spacing: 1px;
      text-transform: uppercase; cursor: pointer;
    }

    /* Painel da Direita (Preview) */
    .preview-panel {
      flex: 1; background-color: #050505; padding: 40px;
      overflow-y: auto; display: flex; justify-content: center;
      align-items: flex-start; height: 100vh;
    }
  </style>
</head>
<body>

  <!-- PAINEL DA ESQUERDA (EDITOR) -->
  <div class="editor-panel">
    <div class="editor-title">Terminal Marinha / Dossiê</div>

    <div class="form-group">
      <label>Nome do Personagem</label>
      <input type="text" id="in-name" value="Monspeet D. Draconis" oninput="update()">
    </div>

    <div class="form-group">
      <label>Subtítulo / Alcunha</label>
      <input type="text" id="in-sub" value="The flame incarnate" oninput="update()">
    </div>

    <div class="form-group">
      <label>Imagem Banner (URL)</label>
      <input type="text" id="in-banner" value="https://i.pinimg.com/1200x/8f/2e/12/8f2e12cbc735eda654a33412fa0d833b.jpg" oninput="update()">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>HP Atual / Máx</label>
        <input type="text" id="in-hp" value="250/250" oninput="update()">
      </div>
      <div class="form-group">
        <label>Saúde Total</label>
        <input type="text" id="in-saude" value="250" oninput="update()">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Desloc. Padrão</label>
        <input type="text" id="in-desloc" value="9" oninput="update()">
      </div>
      <div class="form-group">
        <label>Desloc. Natação</label>
        <input type="text" id="in-natacao" value="6" oninput="update()">
      </div>
    </div>

    <div class="form-group">
      <label>Tag / Título do Turno</label>
      <input type="text" id="in-tag" value="A aventura" oninput="update()">
    </div>

    <div class="form-group">
      <label>Texto da Postagem <span style="color:#666; font-size:9px;">(Selecione e aperte Ctrl+B)</span></label>
      <textarea id="in-text" oninput="update()">Escreva aqui o seu texto da postagem...</textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Objetivo</label>
        <input type="text" id="in-obj" value="Concluir Jornada" oninput="update()">
      </div>
      <div class="form-group">
        <label>Turno</label>
        <input type="text" id="in-turno" value="01" oninput="update()">
      </div>
    </div>

    <div class="editor-subtitle">Dados Analíticos</div>
    <div class="form-group">
      <label>Resumo dos Eventos</label>
      <textarea id="in-resumo-eventos" oninput="update()">Resumo dos acontecimentos...</textarea>
    </div>

    <div class="btn-group">
      <button class="btn-action" onclick="copyHTML()">Copiar Código do Fórum</button>
    </div>
  </div>

  <!-- PAINEL DA DIREITA (PREVISUALIZAÇÃO) -->
  <div class="preview-panel">
    <div id="lunar-preview-target" style="width: 100%; display: flex; justify-content: center;"></div>
  </div>

  <script>
    // Configuração com suas chaves do Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyD0NtmjQopui9mf32dsq59QtmQYNjWkKig",
      authDomain: "templates-online.firebaseapp.com",
      databaseURL: "https://templates-online-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "templates-online",
      storageBucket: "templates-online.firebasestorage.app",
      messagingSenderId: "453002939032",
      appId: "1:453002939032:web:ad3329652007fa89105eed"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let isRemoteUpdate = false;

    // Atalho Ctrl + B para Negrito
    var textInput = document.getElementById('in-text');
    if (textInput) {
      textInput.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && (e.key === 'b' || e.key === 'B')) {
          e.preventDefault();
          var start = this.selectionStart;
          var end = this.selectionEnd;
          var val = this.value;
          var selected = val.substring(start, end);
          var replacement = '<b>' + selected + '</b>';
          this.value = val.substring(0, start) + replacement + val.substring(end);
          if (selected.length > 0) {
            this.selectionStart = start;
            this.selectionEnd = start + replacement.length;
          } else {
            this.selectionStart = this.selectionEnd = start + 3;
          }
          update();
        }
      });
    }

    // Salva na nuvem (Firebase)
    function saveToCloud() {
      if (isRemoteUpdate) return;
      var data = {
        name: document.getElementById('in-name').value,
        sub: document.getElementById('in-sub').value,
        banner: document.getElementById('in-banner').value,
        hp: document.getElementById('in-hp').value,
        saude: document.getElementById('in-saude').value,
        desloc: document.getElementById('in-desloc').value,
        natacao: document.getElementById('in-natacao').value,
        tag: document.getElementById('in-tag').value,
        text: document.getElementById('in-text').value,
        obj: document.getElementById('in-obj').value,
        turno: document.getElementById('in-turno').value,
        resumo: document.getElementById('in-resumo-eventos').value
      };

      db.ref('meu_dossie').set(data);
    }

    // Escuta atualizações da nuvem em tempo real
    db.ref('meu_dossie').on('value', function(snapshot) {
      var data = snapshot.val();
      if (data) {
        isRemoteUpdate = true;
        if(data.name !== undefined) document.getElementById('in-name').value = data.name;
        if(data.sub !== undefined) document.getElementById('in-sub').value = data.sub;
        if(data.banner !== undefined) document.getElementById('in-banner').value = data.banner;
        if(data.hp !== undefined) document.getElementById('in-hp').value = data.hp;
        if(data.saude !== undefined) document.getElementById('in-saude').value = data.saude;
        if(data.desloc !== undefined) document.getElementById('in-desloc').value = data.desloc;
        if(data.natacao !== undefined) document.getElementById('in-natacao').value = data.natacao;
        if(data.tag !== undefined) document.getElementById('in-tag').value = data.tag;
        if(data.text !== undefined) document.getElementById('in-text').value = data.text;
        if(data.obj !== undefined) document.getElementById('in-obj').value = data.obj;
        if(data.turno !== undefined) document.getElementById('in-turno').value = data.turno;
        if(data.resumo !== undefined) document.getElementById('in-resumo-eventos').value = data.resumo;
        
        generateInlineHTML();
        isRemoteUpdate = false;
      }
    });

    // Gera o HTML do Preview na área da direita
    function generateInlineHTML() {
      var name = document.getElementById('in-name').value;
      var sub = document.getElementById('in-sub').value;
      var banner = document.getElementById('in-banner').value;
      var hpVal = document.getElementById('in-hp').value;
      var saude = document.getElementById('in-saude').value;
      var desloc = document.getElementById('in-desloc').value;
      var natacao = document.getElementById('in-natacao').value;
      var tag = document.getElementById('in-tag').value;
      var txt = document.getElementById('in-text').value;
      var obj = document.getElementById('in-obj').value;
      var turno = document.getElementById('in-turno').value;
      var resumo = document.getElementById('in-resumo-eventos').value;

      var pct = 100;
      if(hpVal.indexOf('/') !== -1) {
        var parts = hpVal.split('/');
        var cur = parseFloat(parts[0]) || 0;
        var max = parseFloat(parts[1]) || 1;
        pct = Math.min(100, Math.max(0, (cur / max) * 100));
      }

      var textWithoutTags = txt.replace(/<[^>]*>/g, '');
      var words = textWithoutTags.trim() ? textWithoutTags.trim().split(/\s+/).length : 0;

      var formattedTxt = txt.replace(/\n/g, '</p><p style="margin: 0 0 10px 0;">');
      formattedTxt = formattedTxt.replace(/<b>/g, '<b style="color: #e86830; font-weight: 700;">').replace(/<strong>/g, '<strong style="color: #e86830; font-weight: 700;">');

      var fullHTML = 
        '<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;600;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">' +
        '<div style="width: 100%; max-width: 780px; background-color: #000000; color: #e0e0e0; border-radius: 12px; overflow: hidden; border: 1px solid #1a1a1a; font-family: \'Inter\', sans-serif; margin: 0 auto;">' +
          '<div style="position: relative; height: 260px; background-image: url(\'' + banner + '\'); background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px;">' +
            '<div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.95) 100%);"></div>' +
            '<div style="position: relative; z-index: 2;">' +
              '<div style="font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #e86830; font-weight: 700;">' + sub + '</div>' +
              '<div style="font-family: \'Cinzel\', serif; font-size: 28px; color: #ffffff; margin: 4px 0 10px 0; font-weight: 700;">' + name + '</div>' +
            '</div>' +
            '<div style="position: relative; z-index: 2;">' +
              '<div style="display: flex; justify-content: space-between; font-size: 10px; font-weight: 600; color: #a0a0a0; margin-bottom: 5px;">' +
                '<span>HP / %</span><span>' + hpVal + '</span>' +
              '</div>' +
              '<div style="width: 100%; height: 4px; background: rgba(255, 255, 255, 0.1); border-radius: 2px; overflow: hidden;">' +
                '<div style="height: 100%; background: linear-gradient(90deg, #e86830, #ff3e00); width: ' + pct + '%;"></div>' +
              '</div>' +
            '</div>' +
          '</div>' +

          '<div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 15px 20px; background: #000000;">' +
            '<div style="background: #0a0a0a; border: 1px solid #1f1f1f; border-radius: 8px; padding: 10px; text-align: center;"><span style="font-size: 8px; text-transform: uppercase; color: #888; display: block; margin-bottom: 4px;">Saúde Total</span><span style="font-size: 14px; font-weight: 700; color: #fff;">' + saude + '</span></div>' +
            '<div style="background: #0a0a0a; border: 1px solid #1f1f1f; border-radius: 8px; padding: 10px; text-align: center;"><span style="font-size: 8px; text-transform: uppercase; color: #888; display: block; margin-bottom: 4px;">Aumentos</span><span style="font-size: 14px; font-weight: 700; color: #fff;">0</span></div>' +
            '<div style="background: #0a0a0a; border: 1px solid #1f1f1f; border-radius: 8px; padding: 10px; text-align: center;"><span style="font-size: 8px; text-transform: uppercase; color: #888; display: block; margin-bottom: 4px;">Desloc. Padrão</span><span style="font-size: 14px; font-weight: 700; color: #fff;">' + desloc + '</span></div>' +
            '<div style="background: #0a0a0a; border: 1px solid #1f1f1f; border-radius: 8px; padding: 10px; text-align: center;"><span style="font-size: 8px; text-transform: uppercase; color: #888; display: block; margin-bottom: 4px;">Desloc. Natação</span><span style="font-size: 14px; font-weight: 700; color: #fff;">' + natacao + '</span></div>' +
          '</div>' +

          '<div style="padding: 10px 20px 20px 20px; background: #000000;">' +
            '<div style="font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #e86830; font-weight: 700; margin-bottom: 12px;">' + tag + '</div>' +
            '<div style="font-size: 12px; line-height: 1.7; color: #ccc; text-align: justify;"><p style="margin: 0 0 10px 0;">' + formattedTxt + '</p></div>' +

            '<details style="margin-top: 10px; border-top: 1px solid #1a1a1a;">' +
              '<summary style="display: flex; align-items: center; gap: 8px; color: #ffffff; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; cursor: pointer; padding: 15px 0; outline: none; list-style: none;">' +
                '<span style="width: 8px; height: 8px; background-color: #e86830; border-radius: 50%; box-shadow: 0 0 6px #e86830; display: inline-block;"></span> DOSSIÊ PIRATA' +
              '</summary>' +

              '<div style="padding-top: 10px;">' +
                '<div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; margin-bottom: 15px;">' +
                  '<div style="background: #0a0a0a; border: 1px solid #1f1f1f; border-radius: 8px; padding: 10px; text-align: center;"><span style="font-size: 8px; text-transform: uppercase; color: #888; display: block; margin-bottom: 4px;">Objetivo</span><span style="font-size: 11px; font-weight: 700; color: #fff;">' + obj + '</span></div>' +
                  '<div style="background: #0a0a0a; border: 1px solid #1f1f1f; border-radius: 8px; padding: 10px; text-align: center;"><span style="font-size: 8px; text-transform: uppercase; color: #888; display: block; margin-bottom: 4px;">Palavras</span><span style="font-size: 14px; font-weight: 700; color: #fff;">' + words + '</span></div>' +
                  '<div style="background: #0a0a0a; border: 1px solid #1f1f1f; border-radius: 8px; padding: 10px; text-align: center;"><span style="font-size: 8px; text-transform: uppercase; color: #888; display: block; margin-bottom: 4px;">Turno</span><span style="font-size: 14px; font-weight: 700; color: #fff;">' + turno + '</span></div>' +
                '</div>' +

                '<div style="font-size: 11px; font-weight: 700; color: #e86830; letter-spacing: 1.5px; text-transform: uppercase; border-bottom: 1px dashed #222; padding-bottom: 6px; margin: 15px 0 12px 0;">Resumo dos Acontecimentos</div>' +
                '<div style="font-size: 12px; color: #ccc;">— ' + resumo.replace(/\n/g, '<br>— ') + '</div>' +
              '</div>' +
            '</details>' +

            '<div style="text-align: center; padding: 25px 0 10px 0;">' +
              '<span style="font-family: \'Great Vibes\', cursive; font-size: 38px; color: #000000; text-shadow: -1px -1px 0 #e86830, 1px -1px 0 #e86830, -1px 1px 0 #e86830, 1px 1px 0 #e86830, 0 0 10px #e86830; display: inline-block;">' + name + '</span>' +
            '</div>' +
          '</div>' +
        '</div>';

      document.getElementById('lunar-preview-target').innerHTML = fullHTML;
      return fullHTML;
    }

    function update() {
      generateInlineHTML();
      saveToCloud();
    }

    function copyHTML() {
      var html = generateInlineHTML();
      navigator.clipboard.writeText(html);
      alert('Código copiado com sucesso! Agora basta colar no fórum.');
    }

    // Inicialização da página
    generateInlineHTML();
  </script>
</body>
</html>
